org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Managed Stalky/Supabase configuration is supplied explicitly per build. Keep
# these empty in the checked-in workspace so an unconfigured APK cannot call a
# remote service. Local mode remains fully available without them.
stalkyApiUrl=
stalkySupabaseUrl=
stalkySupabasePublishableKey=
stalkyGoogleWebClientId=
auraEnableBackgroundListeningDefault=false
